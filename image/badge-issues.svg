<svg xmlns="http://www.w3.org/2000/svg" width="96" height="20" role="img" aria-label="Issues: Welcome">
  <title>Issues: Welcome</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="96" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="44" height="20" fill="#555"/>
    <rect x="44" width="52" height="20" fill="#fe7d37"/>
    <rect width="96" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text transform="scale(.1)" x="220" y="150" fill="#010101" fill-opacity=".3">Issues</text>
    <text transform="scale(.1)" x="220" y="140">Issues</text>
    <text transform="scale(.1)" x="700" y="150" fill="#010101" fill-opacity=".3">Welcome</text>
    <text transform="scale(.1)" x="700" y="140">Welcome</text>
  </g>
</svg>
