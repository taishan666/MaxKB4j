<svg xmlns="http://www.w3.org/2000/svg" width="64" height="20" role="img" aria-label="Java: 21+">
  <title>Java: 21+</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="64" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="34" height="20" fill="#555"/>
    <rect x="34" width="30" height="20" fill="#4c1"/>
    <rect width="64" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text transform="scale(.1)" x="170" y="150" fill="#010101" fill-opacity=".3">Java</text>
    <text transform="scale(.1)" x="170" y="140">Java</text>
    <text transform="scale(.1)" x="490" y="150" fill="#010101" fill-opacity=".3">21+</text>
    <text transform="scale(.1)" x="490" y="140">21+</text>
  </g>
</svg>
