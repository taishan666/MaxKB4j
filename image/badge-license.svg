<svg xmlns="http://www.w3.org/2000/svg" width="88" height="20" role="img" aria-label="License: GPLv3">
  <title>License: GPLv3</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="88" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="48" height="20" fill="#555"/>
    <rect x="48" width="40" height="20" fill="#007ec6"/>
    <rect width="88" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text transform="scale(.1)" x="240" y="150" fill="#010101" fill-opacity=".3">License</text>
    <text transform="scale(.1)" x="240" y="140">License</text>
    <text transform="scale(.1)" x="680" y="150" fill="#010101" fill-opacity=".3">GPLv3</text>
    <text transform="scale(.1)" x="680" y="140">GPLv3</text>
  </g>
</svg>
