<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20" role="img" aria-label="Spring Boot: 3.x">
  <title>Spring Boot: 3.x</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="100" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="70" height="20" fill="#555"/>
    <rect x="70" width="30" height="20" fill="#4c1"/>
    <rect width="100" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text transform="scale(.1)" x="350" y="150" fill="#010101" fill-opacity=".3">Spring Boot</text>
    <text transform="scale(.1)" x="350" y="140">Spring Boot</text>
    <text transform="scale(.1)" x="850" y="150" fill="#010101" fill-opacity=".3">3.x</text>
    <text transform="scale(.1)" x="850" y="140">3.x</text>
  </g>
</svg>
