services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/tarzanx/pgvector:0.7.0-pg15
    container_name: maxkb4j-pgvector
    restart: always
    networks:
      - maxkb4j_network
    environment:
      POSTGRES_USER: tarzan_postgres
      POSTGRES_PASSWORD: ycn4NRhjN2
      POSTGRES_DB: MaxKB4j
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
  mongo:
    image: registry.cn-hangzhou.aliyuncs.com/tarzanx/mongo:8.0
    container_name: maxkb4j-mongo
    restart: always
    networks:
      - maxkb4j_network
    environment:
      TZ: 'Asia/Shanghai'
      MONGO_INITDB_ROOT_USERNAME: tarzan_mongo
      MONGO_INITDB_ROOT_PASSWORD: ycn4NRhjN2
    volumes:
      - ./mongo/data:/data/db
      - ./mongo/configdb:/data/configdb
  maxKB4j:
    container_name: maxkb4j-app
    image: registry.cn-hangzhou.aliyuncs.com/tarzanx/maxkb4j:latest
    ports:
      - "8080:8080"
    networks:
      - maxkb4j_network
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
    restart: always
    logging:
      options:
        max-size: "30m"
        max-file: "3"
    environment:
      # JWT 密钥必须由宿主机环境变量提供（未设置时 compose 直接报错，应用侧亦有 fail-fast 校验）
      - SA_TOKEN_JWT_SECRET_KEY=${SA_TOKEN_JWT_SECRET_KEY:?请设置 SA_TOKEN_JWT_SECRET_KEY 环境变量（建议32位以上随机字符串）}
      # 可选：默认管理员口令；不设置时首次启动自动生成随机口令并打印到日志
      - SYSTEM_DEFAULT_PASSWORD=${SYSTEM_DEFAULT_PASSWORD:}
      - SPRING_DATA_MONGODB_URI=mongodb://tarzan_mongo:ycn4NRhjN2@mongo:27017/MaxKB4j?authSource=admin
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MaxKB4j
      - SPRING_DATASOURCE_USERNAME=tarzan_postgres
      - SPRING_DATASOURCE_PASSWORD=ycn4NRhjN2
    volumes:
      - ./logs:/logs
      - ./server.crt:/tmp/certs/server.crt
    entrypoint: >
      sh -c "
      sleep 10;
      exec java -jar maxkb4j-start.jar 
      "
networks:
  maxkb4j_network:
