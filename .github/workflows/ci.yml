name: CI

on:
  push:
    branches: [dev, main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Build Docker image (smoke check)
        run: docker build -t maxkb4j:ci -f maxkb4j-start/Dockerfile maxkb4j-start

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7